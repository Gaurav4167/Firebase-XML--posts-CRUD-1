<body>
    <div class="container-fluid">
        <div class="d-flex flex-column align-items-center top-heading">
            <h3>Posts Data Management</h3>
            <h6>Add, Delete and Update Post Here</h6>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-10 offset-1">
                <div class="card mt-2 mainOuterCard">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4">

                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="form-heading"><i class="fa-solid fa-square-plus"></i> Add New Post
                                        </h4>

                                        <form id="postForm">

                                            <label for="title"><b>Title</b></label>
                                            <input class="mb-4 form-control" id="title" type="text"
                                                placeholder="Enter Title">

                                            <label for="body"><b>body</b></label>
                                            <textarea class="mb-4 form-control" id="body" type="text"
                                                placeholder="Content"> </textarea>

                                            <div class="d-flex justify-content-between">
                                                <div>
                                                    <button id="addBtn" class="btn border shadow btn-primary"><b>Add
                                                            Post</b></button>
                                                    <button id="updateBtn" type="button"
                                                        class="btn border shadow d-none btn-primary"><b>Update</b></button>
                                                </div>

                                                <button id="cancelBtn" type="button"
                                                    class="btn border shadow btn-danger"><b>Cancel</b></button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <div class="col-8">
                                <div class="card">
                                    <div class="card-body" id="addResultPost">
                                        <h4 class="form-heading" id="addFetchedCard"><i class="fa-solid fa-bars"></i>
                                            All Posts
                                        </h4>

                                            <div class="card-body resultPost">

                                                        Fuga veniam ipsum aliquam excepturi quaerat aperiam!</p>
                                                </div>

                                                    <button class="btn btn-primary shadow">EDIT</button>
                                                    <button class="btn btn-danger shadow ml-2">REMOVE</button>
                                                </div>
                                            </div>
                                        </div> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
